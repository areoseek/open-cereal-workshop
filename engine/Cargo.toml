[package]
name = "cereal-engine"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2021"
description = "Audio engine for Breakfast Cereal DAW: project model, .flp reading and writing, sampler, sequencer, mixer. No UI, no audio device."

[dependencies]
arc-swap = "1"
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "adpcm", "flac", "ogg", "vorbis", "mp3", "aiff"] }
miniz_oxide = "0.8"
rusty_mp3 = "1.0.5"
rusty_vorbis = "0.1.2"
libloading = "0.8"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"
