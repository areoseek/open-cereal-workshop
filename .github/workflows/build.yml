# Builds and tests on Linux and Windows. The tests that need a user's own content are skipped when it is absent.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: open-cereal-workshop
          - os: windows-latest
            name: windows-x86_64
            bin: open-cereal-workshop.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked -p open-cereal-workshop
      - name: Pack
        shell: bash
        run: |
          mkdir out
          cp "target/release/${{ matrix.bin }}" LICENSE README.md out/
          cp -r docs out/docs
          cp -r packaging out/packaging
      - name: AppImage
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          mkdir -p tools && printf '#!/bin/sh\nexec "%s/appimagetool" --appimage-extract-and-run "$@"\n' "$PWD" > tools/appimagetool && chmod +x tools/appimagetool
          PATH="$PWD/tools:$PATH" sh packaging/appimage.sh
          cp target/*.AppImage out/
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          iscc packaging\windows.iss
          Copy-Item target\Open-Cereal-Workshop-setup-x86_64.exe out\
      - uses: actions/upload-artifact@v4
        with:
          name: open-cereal-workshop-${{ matrix.name }}
          path: out
